<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA QUERIES</title>
    <style>
        body{
            background-color: black;
        }
        .grid-container{
            display:grid;
            width:100%;
            height:100%;
            grid-template-columns:repeat(3,3fr);
            grid-gap: 0.5em;
            gap:20px;
            align-items: center;
            align-content: space-around;
            justify-content: center;
        }
        .card{
            width:200px;
            height:200px;
            padding:15px;
            align-content: center;
            justify-content: center;
            border-radius:5%;
            background-color: aliceblue;
        }
        img{
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius:5%;
        }
        @media (max-width:768px){
            .grid-container{
                grid-template-columns: repeat(2,5fr);
            }
        }
        @media (max-width:600px){
            .grid-container{
                grid-template-columns: repeat(1,9fr);
            }
        }
        @media (min-width:992px){
            .grid-container{
                grid-template-columns: repeat(3,3fr);
            }
        }

    </style>
</head>
<body>
    <div class="grid-container">
        
            
            <div class="card"><img src="assets/pic1.jpg" alt="image 1"></div>
            <div class="card"><img src="assets/pic2.jpg" alt="image 2"></div>
            <div class="card"><img src="assets/pic5.jpg" alt="image 3"></div>
            <div class="card"><img src="assets/pic4.jpg" alt="image 4"></div>
            <div class="card"><img src="assets/pic3.jpg" alt="image 5"></div>
            <div class="card"><img src="assets/pic8.jpg" alt="image 6"></div>
            <div class="card"><img src="assets/pic7.jpg" alt="image 7"></div>
            <div class="card"><img src="assets/pic6.jpg" alt="image 8"></div>
            <div class="card"><img src="assets/pic9.jpg" alt="image 9"></div>

        
    </div>
</body>
</html>
