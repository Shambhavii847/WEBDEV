<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRST ANIMATION</title>
    <style>
        div{
            width:100px;
            height:100px;
            background-color:rgb(246, 107, 107);
            animation-name:first;
            animation-duration: 4s;
        }
        @keyframes first{
            from{background-color:rgb(246, 107, 107);}
            to{background-color:rgb(165, 251, 251);}
        }
    </style>
</head>
<body>
    <h1>CSS ANIMATION</h1>
    <div></div>
    <p><b>Note:</b> When an animation is finished, it goes back to its original style.</p>
    
</body>
</html>
