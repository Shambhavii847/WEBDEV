<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSFORM+TRANSITION</title>
    <style>
        div{
            width:100px;
            height:100px;
            background-color:rgb(198, 92, 115);
            transition: width 2s, height 2s, transform 2s,background-color 2s,border-radius 5s,transition-timing-function 2s;
            display:inline-block;
        }
        div:hover{
            transform: translate(60px,20px) rotate(101000deg) skewX(20deg) skewY(20deg);
            width:300px;
            height:300px;
            background-color:rgb(126, 226, 241); 
            border-radius:50%;
            transition-timing-function: ease;
            
        }
        
    </style>
</head>
<body>
    <h1>TRANSFORM+TRANSITION</h1>
    <div></div>
    <div>
    </div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    
</body>
</html>
