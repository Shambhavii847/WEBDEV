<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            background: yellow;
            position: absolute;
            left:100px;
            top:150px;
        }
        .box1{
            width: 100px;
            height: 100px;
            background: lightpink;
            position: absolute;
            left: 50px;
            top: 250px;
            z-index: 3;
        }
        .box2{
            width: 100px;
            height: 100px;
            background: skyblue;
            position: absolute;
            left: 75px;
            top: 275px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <h1>This is position property</h1>
    <h2>This is a heading with absolute position</h2>
    <p>HI this is paragraph</p>
    <div class="box1"></div>
    <div class="box2"></div>
</body>
</html>
